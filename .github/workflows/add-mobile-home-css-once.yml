name: Add mobile homepage CSS once
on:
  push:
    paths:
      - '.github/workflows/add-mobile-home-css-once.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link mobile homepage CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link href="mobile-home.css" rel="stylesheet"/>'
          if link not in s:
              s=s.replace('<link href="styles.css" rel="stylesheet"/>','<link href="styles.css" rel="stylesheet"/>\n'+link,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use lighter mobile hero background" || true
          git pull --rebase origin main
          git push origin HEAD:main

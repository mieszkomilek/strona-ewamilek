name: Finalize Admin move once
on:
  push:
    paths:
      - '.github/workflows/finalize-admin-move-once.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move tool out of Numerologia and add Admin menu entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the calculator section + old calculator password modal from Numerologia.
          p = Path('numerologia.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<section class="name-vibration-calculator.*?</section>', '', s, count=1, flags=re.S)
          s = re.sub(r'<div aria-hidden="true" aria-labelledby="nv-password-title".*?</div>\s*</div>(?=</main>)', '', s, count=1, flags=re.S)
          s = s.replace(' i autorskie narzędzie do obliczania wibracji imienia i nazwiska', '')
          p.write_text(s, encoding='utf-8')

          # Add Admin as the final item in every hamburger menu.
          admin_link = '<a class="admin-menu-link" href="admin.html">Admin</a>'
          for f in Path('.').glob('*.html'):
              html = f.read_text(encoding='utf-8')
              menu_pos = html.find('id="menu"')
              if menu_pos == -1:
                  continue
              nav_end = html.find('</nav>', menu_pos)
              if nav_end == -1:
                  continue
              menu_fragment = html[menu_pos:nav_end]
              if 'href="admin.html"' not in menu_fragment:
                  html = html[:nav_end] + admin_link + html[nav_end:]
                  f.write_text(html, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Move Ewa tool to Admin and add Admin navigation" || true
          git pull --rebase origin main
          git push origin HEAD:main

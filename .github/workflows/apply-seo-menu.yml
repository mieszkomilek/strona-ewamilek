name: Apply SEO and menu update
on:
  push:
    paths:
      - '.github/scripts/apply_seo_menu_2026.py'
      - '.github/workflows/apply-seo-menu.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_seo_menu_2026.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vedic-art.html mandala.html anioly.html numerologia.html tworczosc.html jedwab-malowany.html o-mnie.html kontakt.html ebooki.html styles.css script.js sitemap.xml
          git diff --cached --quiet || git commit -m "Apply SEO 2026 and hamburger menu"
          git pull --rebase origin main
          git push origin HEAD:main

name: Embed PayPal into product cards once
on:
  push:
    paths:
      - '.github/scripts/embed_paypal_into_cards_once.py'
      - '.github/workflows/embed-paypal-into-cards-once.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python .github/scripts/embed_paypal_into_cards_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html styles.css
          git diff --cached --quiet || git commit -m "Embed PayPal payments inside product cards"
          git pull --rebase origin main
          git push origin HEAD:main

name: Build final ebook once
on:
  push:
    paths:
      - '.github/scripts/build_ebook_once.py'
      - '.github/workflows/build-ebook-once.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python .github/scripts/build_ebook_once.py
      - name: Commit static PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ebooks/kurs-numerologii-ewa-milek.pdf
          git diff --cached --quiet || git commit -m "Replace numerology ebook with redesigned static PDF"
          git pull --rebase origin main
          git push origin HEAD:main

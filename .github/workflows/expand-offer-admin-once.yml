name: Expand Oferta 2026 and Admin once
on:
  push:
    paths:
      - '.github/workflows/expand-offer-admin-once.yml'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand offer and admin
        run: |
          python - <<'PY'
          from pathlib import Path

          # -------- Oferta 2026: add missing concepts as a separate, payment-neutral section --------
          p=Path('oferta-2026.html')
          s=p.read_text(encoding='utf-8')
          if 'id="offer26-new-ideas"' not in s:
              block='''

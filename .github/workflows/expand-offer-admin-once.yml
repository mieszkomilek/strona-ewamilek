  <div class="offer26-products">
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">20</div><div class="offer26-copy"><h2>Twój Rok Osobisty 2027</h2><p>Osobna prognoza roczna w trzech wariantach: MINI, pełna 12-miesięczna i PREMIUM z osobistymi wskazówkami Ewy.</p><div class="offer26-meta"><span class="offer26-chip">Numerologia</span><span class="offer26-chip">produkt odnawialny co roku</span><span class="offer26-chip">Admin: kalkulator gotowy</span></div><div class="offer26-preview open">Propozycja cen roboczych: MINI 69 zł • pełna 149 zł • PREMIUM 249 zł.</div></div><div class="offer26-buy"><strong>Do decyzji Ewy</strong><small>bez płatności na etapie roboczym</small></div></article>
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">21</div><div class="offer26-copy"><h2>Numerologiczny Plan Roku</h2><p>Rok osobisty rozpisany miesiąc po miesiącu, z miejscem na intencje, decyzje i notatki klienta.</p><div class="offer26-meta"><span class="offer26-chip">Numerologia</span><span class="offer26-chip">12 miesięcy</span><span class="offer26-chip">Admin: generator tabeli</span></div></div><div class="offer26-buy"><strong>129–199 zł</strong><small>cena robocza</small></div></article>
    <article class="offer26-card" data-cat="premium"><div class="offer26-num">22</div><div class="offer26-copy"><h2>Portret Partnerski</h2><p>Porównanie dwóch osób: Droga Życia, liczby z imienia i nazwiska, podobieństwa, różnice i cykle. Interpretacja końcowa będzie oparta na wiedzy Ewy.</p><div class="offer26-meta"><span class="offer26-chip">Relacje</span><span class="offer26-chip">2 osoby</span><span class="offer26-chip">Admin: porównanie liczb</span></div></div><div class="offer26-buy"><strong>490–790 zł</strong><small>cena robocza</small></div></article>
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">23</div><div class="offer26-copy"><h2>Numerologia Kariery i Talentów</h2><p>Osobny produkt z istniejącego rozszerzenia: predyspozycje, talenty, sposób działania, kierunki zawodowe i tematy rozwoju.</p><div class="offer26-meta"><span class="offer26-chip">Kariera</span><span class="offer26-chip">Talenty</span><span class="offer26-chip">Admin: profil bazowy</span></div></div><div class="offer26-buy"><strong>249–390 zł</strong><small>cena robocza</small></div></article>
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">24</div><div class="offer26-copy"><h2>Numerologia dla Firmy — wybór nazwy</h2><p>Porównanie kilku nazw firmy lub marki, ich podstawowych wibracji oraz daty rozpoczęcia działalności lub projektu.</p><div class="offer26-meta"><span class="offer26-chip">Biznes</span><span class="offer26-chip">do 5 nazw</span><span class="offer26-chip">Admin: porównywarka nazw</span></div></div><div class="offer26-buy"><strong>290–650 zł</strong><small>w zależności od wariantu</small></div></article>
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">25</div><div class="offer26-copy"><h2>Portret Numerologiczny Dziecka</h2><p>Profil bazowy dla rodzica: Droga Życia, liczby z imienia, naturalne predyspozycje i cykle. Interpretacja będzie wymagała materiałów Ewy.</p><div class="offer26-meta"><span class="offer26-chip">Dziecko</span><span class="offer26-chip">dla rodziców</span><span class="offer26-chip">Admin: kalkulator gotowy</span></div></div><div class="offer26-buy"><strong>249–390 zł</strong><small>cena robocza</small></div></article>
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">26</div><div class="offer26-copy"><h2>Prognoza 9-letniego cyklu</h2><p>Dziewięć kolejnych lat osobistych przedstawionych w jednym czytelnym planie.</p><div class="offer26-meta"><span class="offer26-chip">9 lat</span><span class="offer26-chip">cykl</span><span class="offer26-chip">Admin: generator gotowy</span></div></div><div class="offer26-buy"><strong>290–450 zł</strong><small>cena robocza</small></div></article>
    <article class="offer26-card" data-cat="numerologia"><div class="offer26-num">27</div><div class="offer26-copy"><h2>Numerologiczna data startu firmy / projektu</h2><p>Porównanie kilku proponowanych dat i ich wibracji, z zestawieniem z datą urodzenia właściciela.</p><div class="offer26-meta"><span class="offer26-chip">Biznes</span><span class="offer26-chip">daty</span><span class="offer26-chip">Admin: porównywarka dat</span></div></div><div class="offer26-buy"><strong>190–290 zł</strong><small>cena robocza</small></div></article>
    <article class="offer26-card" data-cat="mandala premium"><div class="offer26-num">28</div><div class="offer26-copy"><h2>Mandala Twojej Wibracji</h2><p>Produkt premium łączący wybrane liczby z portretu numerologicznego z indywidualną Mandalą stworzoną przez Ewę.</p><div class="offer26-meta"><span class="offer26-chip">Mandala</span><span class="offer26-chip">Numerologia</span><span class="offer26-chip">produkt premium</span></div></div><div class="offer26-buy"><strong>Do wyceny</strong><small>po decyzji Ewy o zakresie</small></div></article>
    <article class="offer26-card" data-cat="tworczosc"><div class="offer26-num">29</div><div class="offer26-copy"><h2>Warsztaty tematyczne Ewy</h2><p>Autorskie formaty niezależne od pełnego kursu Vedic Art: Mandala Intencji, Kolory Twojego Roku, Moja Droga Życia w obrazie, Kobiecy dzień twórczy.</p><div class="offer26-meta"><span class="offer26-chip">Twórczość</span><span class="offer26-chip">warsztat</span><span class="offer26-chip">autorski format Ewy</span></div></div><div class="offer26-buy"><strong>Do ustalenia</strong><small>czas i cena po pilotażu</small></div></article>
  </div>
</div></section>
'''
              marker='</main>'
              s=s.replace(marker,block+marker,1)
              p.write_text(s,encoding='utf-8')

          # -------- Admin: append deterministic calculators and generators --------
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          if 'id="admin-extended-numerology"' not in s:
              modules='''
<section class="container admin-tools" id="admin-extended-numerology">
  <section class="admin-section" id="admin-year-planner"><div class="admin-badges"><span class="admin-badge offer">Oferta – Numerologiczny Plan Roku</span><span class="admin-badge">generator 12 miesięcy</span></div><h2>Plan roku osobistego — 12 miesięcy</h2><p>Generuje rok osobisty oraz miesiące osobiste od stycznia do grudnia.</p><div class="admin-grid"><label class="admin-field"><span>Data urodzenia</span><input id="ap-birth" type="date"></label><label class="admin-field"><span>Rok</span><input id="ap-year" type="number" min="1900" max="2200"></label></div><div class="admin-actions"><button class="btn btn-primary" id="ap-calc" type="button">Generuj plan roku</button></div><div class="admin-output" id="ap-output">Wyniki pojawią się tutaj.</div></section>
  <section class="admin-section" id="admin-nine-year"><div class="admin-badges"><span class="admin-badge offer">Oferta – Prognoza 9-letniego cyklu</span><span class="admin-badge">generator cyklu</span></div><h2>Cykl 9 kolejnych lat osobistych</h2><div class="admin-grid"><label class="admin-field"><span>Data urodzenia</span><input id="a9-birth" type="date"></label><label class="admin-field"><span>Rok początkowy</span><input id="a9-year" type="number" min="1900" max="2200"></label></div><div class="admin-actions"><button class="btn btn-primary" id="a9-calc" type="button">Generuj 9 lat</button></div><div class="admin-output" id="a9-output">Wyniki pojawią się tutaj.</div></section>
  <section class="admin-section" id="admin-partners"><div class="admin-badges"><span class="admin-badge offer">Oferta – Portret Partnerski</span><span class="admin-badge">porównanie liczb</span><span class="admin-badge warn">Interpretacja: wiedza Ewy później</span></div><h2>Porównanie dwóch osób</h2><div class="admin-grid"><label class="admin-field"><span>Osoba A — imię i nazwisko</span><input id="rel-name-a"></label><label class="admin-field"><span>Osoba A — data urodzenia</span><input id="rel-date-a" type="date"></label><label class="admin-field"><span>Osoba B — imię i nazwisko</span><input id="rel-name-b"></label><label class="admin-field"><span>Osoba B — data urodzenia</span><input id="rel-date-b" type="date"></label></div><div class="admin-actions"><button class="btn btn-primary" id="rel-calc" type="button">Porównaj liczby</button></div><div class="admin-output" id="rel-output">Wyniki pojawią się tutaj.</div></section>
  <section class="admin-section" id="admin-child"><div class="admin-badges"><span class="admin-badge offer">Oferta – Portret Numerologiczny Dziecka</span><span class="admin-badge">profil bazowy</span></div><h2>Profil bazowy dziecka</h2><div class="admin-grid"><label class="admin-field"><span>Imię i nazwisko</span><input id="child-name"></label><label class="admin-field"><span>Data urodzenia</span><input id="child-date" type="date"></label></div><div class="admin-actions"><button class="btn btn-primary" id="child-calc" type="button">Oblicz profil</button></div><div class="admin-output" id="child-output">Wyniki pojawią się tutaj.</div></section>
  <section class="admin-section" id="admin-career"><div class="admin-badges"><span class="admin-badge offer">Oferta – Numerologia Kariery i Talentów</span><span class="admin-badge">pakiet liczb bazowych</span></div><h2>Profil kariery — liczby do interpretacji</h2><p>Wylicza podstawowe liczby, które później generator interpretacji połączy z wiedzą Ewy o powołaniu, talentach i pracy.</p><div class="admin-grid"><label class="admin-field"><span>Imię i nazwisko</span><input id="career-name"></label><label class="admin-field"><span>Data urodzenia</span><input id="career-date" type="date"></label></div><div class="admin-actions"><button class="btn btn-primary" id="career-calc" type="button">Oblicz profil kariery</button></div><div class="admin-output" id="career-output">Wyniki pojawią się tutaj.</div></section>
  <section class="admin-section" id="admin-business-names"><div class="admin-badges"><span class="admin-badge offer">Oferta – Numerologia dla Firmy</span><span class="admin-badge">do 5 nazw</span></div><h2>Porównywarka nazw firmy / marki</h2><div class="admin-grid"><label class="admin-field"><span>Nazwa 1</span><input class="biz-name"></label><label class="admin-field"><span>Nazwa 2</span><input class="biz-name"></label><label class="admin-field"><span>Nazwa 3</span><input class="biz-name"></label><label class="admin-field"><span>Nazwa 4</span><input class="biz-name"></label><label class="admin-field"><span>Nazwa 5</span><input class="biz-name"></label></div><div class="admin-actions"><button class="btn btn-primary" id="biz-calc" type="button">Porównaj nazwy</button></div><div class="admin-output" id="biz-output">Wyniki pojawią się tutaj.</div></section>
  <section class="admin-section" id="admin-start-dates"><div class="admin-badges"><span class="admin-badge offer">Oferta – Data startu firmy / projektu</span><span class="admin-badge">porównywarka dat</span></div><h2>Porównanie proponowanych dat</h2><div class="admin-grid"><label class="admin-field"><span>Data urodzenia właściciela</span><input id="start-owner" type="date"></label><label class="admin-field"><span>Data A</span><input class="start-date" type="date"></label><label class="admin-field"><span>Data B</span><input class="start-date" type="date"></label><label class="admin-field"><span>Data C</span><input class="start-date" type="date"></label><label class="admin-field"><span>Data D</span><input class="start-date" type="date"></label></div><div class="admin-actions"><button class="btn btn-primary" id="start-calc" type="button">Porównaj daty</button></div><div class="admin-output" id="start-output">Wyniki pojawią się tutaj.</div></section>
</section>
'''
              s=s.replace('</main>',modules+'</main>',1)
              js='''
<script>
(()=>{
 const red=n=>{n=Math.abs(Number(n)||0);while(n>9&&![11,22,33].includes(n))n=String(n).split('').reduce((a,b)=>a+Number(b),0);return n};
 const dp=v=>{if(!v)return null;const [y,m,d]=v.split('-').map(Number);return{y,m,d}};
 const life=p=>p?red(String(p.y)+String(p.m).padStart(2,'0')+String(p.d).padStart(2,'0').split('').reduce((a,b)=>a+Number(b),0)):0;
 const life2=p=>p?red([...String(p.y),...String(p.m).padStart(2,'0'),...String(p.d).padStart(2,'0')].reduce((a,x)=>a+Number(x),0)):0;
 const py=(p,y)=>p?red(red(p.m)+red(p.d)+red(y)):0;
 const norm=s=>(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ł/g,'L').replace(/[^A-Z]/g,'');
 const vv=ch=>((ch.charCodeAt(0)-65)%9)+1;
 const ns=(name,mode='all')=>[...norm(name)].filter(ch=>{const v='AEIOUY'.includes(ch);return mode==='all'||(mode==='v'&&v)||(mode==='c'&&!v)}).reduce((a,ch)=>a+vv(ch),0);
 const profile=name=>{const er=ns(name),sr=ns(name,'v'),pr=ns(name,'c');return{e:red(er),er,s:red(sr),sr,p:red(pr),pr}};
 const fprof=(name,p)=>{const n=profile(name),l=life2(p);return`Droga Życia: ${l}\nDzień urodzenia: ${p?red(p.d):'—'}\nEkspresja / Przeznaczenie: ${n.e} (suma ${n.er})\nDążenie Duszy: ${n.s} (suma ${n.sr})\nOsobowość: ${n.p} (suma ${n.pr})\nDojrzałość: ${red(l+n.e)}`};
 const now=new Date(),cy=now.getFullYear();document.querySelector('#ap-year')&&(document.querySelector('#ap-year').value=cy);document.querySelector('#a9-year')&&(document.querySelector('#a9-year').value=cy);
 document.querySelector('#ap-calc')?.addEventListener('click',()=>{const p=dp(document.querySelector('#ap-birth').value),y=+document.querySelector('#ap-year').value||cy,o=document.querySelector('#ap-output');if(!p){o.textContent='Uzupełnij datę urodzenia.';return}const r=py(p,y);o.textContent=`Rok osobisty ${y}: ${r}\n\n`+Array.from({length:12},(_,i)=>`${String(i+1).padStart(2,'0')}.${y} — miesiąc osobisty ${red(r+i+1)}`).join('\n')});
 document.querySelector('#a9-calc')?.addEventListener('click',()=>{const p=dp(document.querySelector('#a9-birth').value),y=+document.querySelector('#a9-year').value||cy,o=document.querySelector('#a9-output');if(!p){o.textContent='Uzupełnij datę urodzenia.';return}o.textContent=Array.from({length:9},(_,i)=>`${y+i} — Rok osobisty ${py(p,y+i)}`).join('\n')});
 document.querySelector('#rel-calc')?.addEventListener('click',()=>{const na=document.querySelector('#rel-name-a').value,nb=document.querySelector('#rel-name-b').value,da=dp(document.querySelector('#rel-date-a').value),db=dp(document.querySelector('#rel-date-b').value),o=document.querySelector('#rel-output');if(!na||!nb||!da||!db){o.textContent='Uzupełnij dane obu osób.';return}const a=profile(na),b=profile(nb),la=life2(da),lb=life2(db);o.textContent=`OSOBA A\n${fprof(na,da)}\n\nOSOBA B\n${fprof(nb,db)}\n\nPORÓWNANIE\nDrogi Życia: ${la} ↔ ${lb}\nEkspresja: ${a.e} ↔ ${b.e}\nDążenie Duszy: ${a.s} ↔ ${b.s}\nOsobowość: ${a.p} ↔ ${b.p}\nSuma Dróg Życia: ${red(la+lb)}\n\nInterpretacja relacji zostanie dodana po zasileniu wiedzą Ewy.`});
 document.querySelector('#child-calc')?.addEventListener('click',()=>{const n=document.querySelector('#child-name').value,p=dp(document.querySelector('#child-date').value),o=document.querySelector('#child-output');o.textContent=n&&p?fprof(n,p)+'\n\nInterpretacja rozwojowa: do zasilenia wiedzą Ewy.':'Uzupełnij imię i datę urodzenia.'});
 document.querySelector('#career-calc')?.addEventListener('click',()=>{const n=document.querySelector('#career-name').value,p=dp(document.querySelector('#career-date').value),o=document.querySelector('#career-output');o.textContent=n&&p?fprof(n,p)+'\n\nInterpretacja talentów, powołania i pracy: do zasilenia wiedzą Ewy.':'Uzupełnij imię i datę urodzenia.'});
 document.querySelector('#biz-calc')?.addEventListener('click',()=>{const names=[...document.querySelectorAll('.biz-name')].map(x=>x.value.trim()).filter(Boolean),o=document.querySelector('#biz-output');if(!names.length){o.textContent='Wpisz co najmniej jedną nazwę.';return}o.textContent=names.map((n,i)=>{const x=profile(n);return`${i+1}. ${n}\n   Ekspresja ${x.e} (suma ${x.er}) • Dążenie Duszy ${x.s} • Osobowość ${x.p}`}).join('\n\n')+'\n\nRekomendacja najlepszej nazwy: do zasilenia wiedzą Ewy.'});
 document.querySelector('#start-calc')?.addEventListener('click',()=>{const owner=dp(document.querySelector('#start-owner').value),dates=[...document.querySelectorAll('.start-date')].map(x=>dp(x.value)).filter(Boolean),o=document.querySelector('#start-output');if(!dates.length){o.textContent='Wpisz co najmniej jedną datę.';return}o.textContent=dates.map((d,i)=>`${String.fromCharCode(65+i)}. ${String(d.d).padStart(2,'0')}.${String(d.m).padStart(2,'0')}.${d.y} — wibracja daty ${life2(d)}${owner?` • rok osobisty właściciela ${py(owner,d.y)}`:''}`).join('\n')+'\n\nWybór i interpretacja najlepszej daty: do zasilenia wiedzą Ewy.'});
})();
</script>
'''
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oferta-2026.html admin.html
          git commit -m "Expand Oferta 2026 and Admin numerology tools" || true
          git pull --rebase origin main
          git push origin HEAD:main

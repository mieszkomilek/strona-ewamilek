name: Build ebook PDF
on:
  push:
    paths:
      - 'ebook-src/**'
      - '.github/workflows/ebook.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install weasyprint
      - run: |
          python ebook-src/build_ebook.py
          mkdir -p assets/ebooks
          weasyprint ebook-src/kurs-numerologii.html assets/ebooks/kurs-numerologii-ewa-milek.pdf
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebook-src/kurs-numerologii.html assets/ebooks/kurs-numerologii-ewa-milek.pdf
          git diff --cached --quiet || git commit -m "Build styled numerology ebook PDF"
          git pull --rebase origin main
          git push origin HEAD:main

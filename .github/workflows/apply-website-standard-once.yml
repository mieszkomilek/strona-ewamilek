name: Apply website standard once
on:
  push:
    paths: ['.github/workflows/apply-website-standard-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wait for version checkpoint and sync
        run: sleep 20 && git pull --rebase origin main
      - name: Generate reusable site foundation
        run: |
          mkdir -p data scripts assets/js
          cat > site.config.json <<'EOF'
          {"siteName":"EwaMiłek","legalName":"Ewa Miłek","baseUrl":"https://ewamilek.pl/","language":"pl-PL","locale":"pl_PL","themeColor":"#f8e9ef","email":"milekewa@o2.pl","social":{"facebook":"https://www.facebook.com/milekewa","instagram":"https://www.instagram.com/ewamilek.art"},"defaultImage":"assets/ewa-milek-vedic-art.jpg","indexablePages":["index.html","vedic-art.html","mandala.html","anioly.html","numerologia.html","jedwab-malowany.html","o-mnie.html","kontakt.html","ebooki.html"],"privateOrPreviewPages":["admin.html","oferta-2026.html","tworczosc.html"]}
          EOF
          cat > data/catalog.json <<'EOF'
          {"currency":"PLN","note":"Katalog oferty bez konfiguracji płatności. PayPal pozostaje niezależny.","items":[{"id":"mandala-osobista","title":"Mandala Osobista","priceFrom":3500,"page":"mandala.html"},{"id":"aniol-opiekunczy","title":"Anioł Opiekuńczy","price":3900,"page":"anioly.html"},{"id":"portret-numerologiczny","title":"Portret Numerologiczny","price":650,"page":"numerologia.html"},{"id":"portret-mikro","title":"Portret Numerologiczny MIKRO","price":400,"page":"numerologia.html"},{"id":"jedwab-malowany","title":"Kurs malowania na jedwabiu","price":500,"page":"jedwab-malowany.html"}]}
          EOF
          cat > manifest.webmanifest <<'EOF'
          {"name":"EwaMiłek","short_name":"EwaMiłek","lang":"pl-PL","start_url":"/","scope":"/","display":"standalone","background_color":"#fffafd","theme_color":"#f8e9ef","icons":[{"src":"/assets/favicon.svg","sizes":"any","type":"image/svg+xml"}]}
          EOF
          cat > scripts/site_build.py <<'PY'
          from pathlib import Path
          import json,re
          from datetime import date
          R=Path(__file__).resolve().parents[1]; c=json.loads((R/'site.config.json').read_text(encoding='utf-8')); base=c['baseUrl']
          def url(n): return base if n=='index.html' else base+n
          for p in R.glob('*.html'):
              s=p.read_text(encoding='utf-8').replace('https://mieszkomilek.github.io/strona-ewamilek/',base)
              if 'manifest.webmanifest' not in s:s=s.replace('</head>','<link href="manifest.webmanifest" rel="manifest"/>\n</head>',1)
              if p.name in c['indexablePages']:
                  u=url(p.name)
                  s=re.sub(r'<link\s+href="[^"]*"\s+rel="canonical"\s*/?>',f'<link href="{u}" rel="canonical"/>',s,count=1)
                  s=re.sub(r'<meta\s+content="[^"]*"\s+property="og:url"\s*/?>',f'<meta content="{u}" property="og:url"/>',s,count=1)
                  if p.name!='index.html' and u+'#breadcrumb' not in s:
                      h=re.search(r'<h1[^>]*>(.*?)</h1>',s,re.S); label=re.sub('<[^>]+>','',h.group(1)).strip() if h else p.stem
                      j=json.dumps({'@context':'https://schema.org','@type':'BreadcrumbList','@id':u+'#breadcrumb','itemListElement':[{'@type':'ListItem','position':1,'name':'EwaMiłek','item':base},{'@type':'ListItem','position':2,'name':label,'item':u}]},ensure_ascii=False,separators=(',',':'))
                      s=s.replace('</head>',f'<script type="application/ld+json">{j}</script>\n</head>',1)
              p.write_text(s,encoding='utf-8')
          (R/'robots.txt').write_text(f'User-agent: *\nAllow: /\n\nSitemap: {base}sitemap.xml\n',encoding='utf-8')
          d=date.today().isoformat(); rows='\n'.join(f'  <url>\n    <loc>{url(n)}</loc>\n    <lastmod>{d}</lastmod>\n  </url>' for n in c['indexablePages'] if (R/n).exists())
          (R/'sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+rows+'\n</urlset>\n',encoding='utf-8')
          PY
          cat > scripts/site_qa.py <<'PY'
          from pathlib import Path
          import json,re,sys
          R=Path(__file__).resolve().parents[1]; c=json.loads((R/'site.config.json').read_text(encoding='utf-8')); b=c['baseUrl']; E=[]; W=[]; titles={}
          for n in c['indexablePages']:
              p=R/n
              if not p.exists():E.append(n+': brak pliku');continue
              s=p.read_text(encoding='utf-8');u=b if n=='index.html' else b+n
              if 'mieszkomilek.github.io/strona-ewamilek' in s:E.append(n+': stara domena')
              if f'href="{u}" rel="canonical"' not in s:E.append(n+': canonical')
              if len(re.findall(r'<h1\b',s,re.I))!=1:E.append(n+': H1')
              m=re.search(r'<title>(.*?)</title>',s,re.S)
              if not m:E.append(n+': title')
              else:
                  t=re.sub(r'\s+',' ',m.group(1)).strip()
                  if t in titles:W.append(n+': duplikat title z '+titles[t])
                  titles[t]=n
              if 'name="description"' not in s:E.append(n+': description')
              if 'manifest.webmanifest' not in s:E.append(n+': manifest')
              for img in re.findall(r'<img\b[^>]*>',s,re.I):
                  if not re.search(r'\balt=',img,re.I):W.append(n+': obraz bez alt')
          for n in c['privateOrPreviewPages']:
              p=R/n
              if p.exists() and 'noindex' not in p.read_text(encoding='utf-8').lower():W.append(n+': brak noindex')
          print('\n'.join('WARN '+x for x in W));print('\n'.join('ERROR '+x for x in E));print('errors',len(E),'warnings',len(W));sys.exit(1 if E else 0)
          PY
          cat > lighthouserc.json <<'EOF'
          {"ci":{"collect":{"staticDistDir":".","numberOfRuns":1},"assert":{"assertions":{"categories:performance":["warn",{"minScore":0.8}],"categories:accessibility":["warn",{"minScore":0.9}],"categories:best-practices":["warn",{"minScore":0.85}],"categories:seo":["warn",{"minScore":0.9}]}},"upload":{"target":"temporary-public-storage"}}}
          EOF
          cat > WEBSITE_STANDARD.md <<'EOF'
          # Website Standard

          Ten projekt jest bazą dla kolejnych statycznych stron. `site.config.json` jest źródłem domeny i ustawień SEO, `data/catalog.json` przechowuje dane oferty bez płatności, `scripts/site_build.py` generuje techniczne SEO, a `scripts/site_qa.py` kontroluje jakość. Nowy projekt powinien zmieniać konfigurację, treści i assety zamiast wpisywać domenę ręcznie w wielu plikach.

          ## Zasady
          1. Produkcyjna domena jest ustawiana w `site.config.json`.
          2. Sitemap, robots, canonical i `og:url` są generowane automatycznie.
          3. Strony prywatne i podglądowe nie trafiają do sitemap.
          4. Każda indeksowana strona ma jeden H1, title, description i self-canonical.
          5. Runtime JS jest dzielony funkcjonalnie na core, effects, numerology i ebooks.
          6. PayPal nie jest częścią tej warstwy i nie jest przez nią modyfikowany.
          EOF
          python scripts/site_build.py
          python scripts/site_qa.py
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js');s=p.read_text(encoding='utf-8')
          marks=[";(()=>{\n  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;",";(()=>{\n  const root=document.querySelector('#wibracja-imienia-nazwiska');",";(()=>{\n  const hero=document.querySelector('.hero-photo-bg');",'/* E-book library: password + in-page PDF reader */']
          if all(x in s for x in marks):
              a,b,c,d=[s.index(x) for x in marks]
              Path('assets/js/core.js').write_text(s[:a].strip()+'\n',encoding='utf-8')
              Path('assets/js/effects.js').write_text((s[a:b]+s[c:d]).strip()+'\n',encoding='utf-8')
              Path('assets/js/numerology.js').write_text(s[b:c].strip()+'\n',encoding='utf-8')
              Path('assets/js/ebooks.js').write_text(s[d:].strip()+'\n',encoding='utf-8')
              bundle='<script src="assets/js/core.js"></script><script src="assets/js/effects.js"></script><script src="assets/js/numerology.js"></script><script src="assets/js/ebooks.js"></script>'
              for h in Path('.').glob('*.html'):
                  t=h.read_text(encoding='utf-8').replace('<script src="script.js"></script>',bundle);h.write_text(t,encoding='utf-8')
              p.write_text('/* Compatibility placeholder: runtime moved to assets/js/*.js */\n',encoding='utf-8')
          PY
      - name: Commit generated foundation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site.config.json data scripts assets/js manifest.webmanifest lighthouserc.json WEBSITE_STANDARD.md robots.txt sitemap.xml '*.html' script.js
          git commit -m 'Apply reusable website standard files' || exit 0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

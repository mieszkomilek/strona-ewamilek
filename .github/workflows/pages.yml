name: Build QA and deploy Pages

on:
  workflow_run:
    workflows: ["Bump site version"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build technical SEO and runtime extensions
        run: python scripts/site_build.py

      - name: SEO and HTML quality gate
        run: python scripts/site_qa.py

      - name: Verify deploy inputs
        run: |
          test -s version.txt
          test -s admin.html
          test -s oferta-2026.html
          test -s assets/js/offer-admin-knowledge.js
          grep -q 'assets/js/offer-admin-knowledge.js' admin.html
          grep -q 'assets/js/offer-admin-knowledge.js' oferta-2026.html
          echo "Deploying version: $(cat version.txt)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lighthouse smoke test
        run: npx --yes @lhci/cli@0.14.x autorun

name: Bump site version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: site-version-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increment version and record restore point
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import subprocess

          p = Path('version.txt')
          raw = p.read_text(encoding='utf-8').strip() if p.exists() else '1.00'
          major, minor = raw.split('.', 1)
          hundredths = int(major) * 100 + int(minor[:2].ljust(2, '0')) + 1
          new_version = f'{hundredths // 100}.{hundredths % 100:02d}'
          p.write_text(new_version + '\n', encoding='utf-8')

          source_commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')
          hist = Path('VERSION_HISTORY.md')
          if not hist.exists():
              hist.write_text('# Historia wersji strony EwaMiłek\n\n| Wersja | Commit | Data UTC | Uwagi |\n|---|---|---|---|\n', encoding='utf-8')
          text = hist.read_text(encoding='utf-8')
          row = f'| {new_version} | `{source_commit}` | {now} | Automatyczny punkt przywracania |\n'
          marker='|---|---|---|---|\n'
          if row not in text:
              text = text.replace(marker, marker+row, 1) if marker in text else text+'\n'+row
          hist.write_text(text, encoding='utf-8')
          print(f'{raw} -> {new_version} @ {source_commit}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt VERSION_HISTORY.md
          git commit -m "Bump site version" || exit 0
          NEW_VERSION=$(tr -d '\n' < version.txt)
          git tag -f "site-v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "site-v${NEW_VERSION}" --force

name: Add Admin page once
on:
  push:
    paths:
      - '.github/workflows/admin-page-once.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build Admin page
        run: |
          python - <<'PY'
          from pathlib import Path

          nump = Path('numerologia.html')
          num = nump.read_text(encoding='utf-8')
          start = num.index('<section class="name-vibration-calculator')
          end = num.index('</section>', start) + len('</section>')
          calc = num[start:end]
          num = num[:start] + num[end:]

          modal_start = num.find('<div aria-hidden="true" aria-labelledby="nv-password-title"')
          if modal_start != -1:
              modal_end = num.find('</div></main>', modal_start)
              if modal_end != -1:
                  num = num[:modal_start] + num[modal_end + len('</div>'):]

          num = num.replace(' i autorskie narzędzie do obliczania wibracji imienia i nazwiska', '')
          nump.write_text(num, encoding='utf-8')

          calc = calc.replace('name-vibration-calculator calc-locked', 'name-vibration-calculator calc-unlocked', 1)
          lock_start = calc.find('<div class="calc-lock-cover" id="nv-lock-cover">')
          if lock_start != -1:
              lock_end = calc.find('</div>', calc.find('</button>', lock_start)) + len('</div>')
              calc = calc[:lock_start] + calc[lock_end:]

          admin = f'''<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Ewa Miłek</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f8e9ef">
<link href="assets/favicon.svg" rel="icon" type="image/svg+xml"><link href="styles.css" rel="stylesheet">
<style>
.admin-page{{min-height:100vh;background:linear-gradient(180deg,#fffafd,#fbf7ff)}}.admin-main{{padding:7rem 0 6rem}}.admin-head{{margin-bottom:2rem}}.admin-head p{{max-width:760px;color:var(--muted)}}
.admin-main .name-vibration-calculator{{margin-top:0!important;padding-top:0!important;border-top:0!important}}.admin-gate{{position:fixed;z-index:3000;inset:0;display:grid;place-items:center;padding:20px;background:rgba(31,20,43,.92);backdrop-filter:blur(18px)}}.admin-gate.hidden{{display:none}}.admin-gate-card{{width:min(520px,100%);padding:42px;border-radius:30px;background:linear-gradient(145deg,#fff,#f8f2ff);text-align:center;box-shadow:0 35px 100px rgba(15,8,26,.38)}}.admin-gate-card input{{width:100%;height:60px;border:1px solid #d8c9e7;border-radius:16px;text-align:center;font-size:1.4rem;letter-spacing:.2em}}.admin-gate-card .btn{{width:100%;margin-top:12px}}.admin-error{{min-height:22px;color:#a44269}}.admin-locked{{height:100vh;overflow:hidden;filter:blur(5px);pointer-events:none;user-select:none}}.admin-menu-link{{margin-top:12px!important;padding-top:17px!important;border-top:1px solid rgba(105,72,176,.18)!important;opacity:.75}}
</style></head><body class="admin-page">
<div class="admin-gate" id="admin-gate"><div class="admin-gate-card"><p class="eyebrow">Strefa prywatna</p><h2>Admin</h2><p>Podaj dzienne hasło administratora.</p><form id="admin-form"><input id="admin-password" type="password" inputmode="numeric" maxlength="8" placeholder="••••••••"><p id="admin-error" class="admin-error"></p><button class="btn btn-primary" type="submit">Wejdź do panelu</button></form></div></div>
<div id="admin-content" class="admin-locked"><header class="site-header" id="top"><div class="nav-wrap container"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span><strong>EwaMiłek</strong><small>moja autorska strona internetowa</small></span></a><button aria-controls="menu" aria-expanded="false" aria-label="Otwórz menu i działy" class="menu-btn" type="button"><span aria-hidden="true" class="menu-icon"><i></i><i></i><i></i></span><span class="menu-label">Menu / Działy</span></button><nav aria-label="Główna nawigacja" class="nav-links" id="menu"><a href="oferta-2026.html">Oferta 2026</a><a href="vedic-art.html">Vedic Art</a><a href="mandala.html">Mandala</a><a href="anioly.html">Anioły</a><a href="numerologia.html">Numerologia</a><a href="tworczosc.html">Twórczość</a><a href="jedwab-malowany.html">Jedwab Malowany</a><a href="o-mnie.html">O mnie</a><a href="ebooki.html">E-booki</a><a class="nav-cta" href="kontakt.html">Kontakt</a><a class="admin-menu-link" href="admin.html">Admin</a></nav></div></header><main class="admin-main"><div class="container admin-head"><p class="eyebrow">Prywatne narzędzia Ewy</p><h1>Admin</h1><p>Robocza przestrzeń z narzędziami przeznaczonymi do codziennej pracy Ewy Miłek.</p></div>{calc}</main><footer class="site-footer"><div class="container footer-premium"><div class="footer-bottom"><span>© 2026 Ewa Miłek · Admin</span><span class="footer-signature">Ewa Miłek</span></div></div></footer></div>
<script src="script.js"></script><script src="version.js"></script><script>(()=>{{const g=document.querySelector('#admin-gate'),c=document.querySelector('#admin-content'),f=document.querySelector('#admin-form'),i=document.querySelector('#admin-password'),e=document.querySelector('#admin-error');const pass=()=>{{const d=new Date();return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}};const unlock=()=>{{g.classList.add('hidden');c.classList.remove('admin-locked');sessionStorage.setItem('ewaAdminUnlocked','1')}};if(sessionStorage.getItem('ewaAdminUnlocked')==='1')unlock();else setTimeout(()=>i.focus(),80);f.addEventListener('submit',x=>{{x.preventDefault();if(i.value.trim()===pass())unlock();else{{e.textContent='Nieprawidłowe hasło.';i.select()}}}})}})();</script></body></html>'''
          Path('admin.html').write_text(admin, encoding='utf-8')

          admin_link = '<a class="admin-menu-link" href="admin.html">Admin</a>'
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if 'id="menu"' in s and 'href="admin.html"' not in s:
                  pos = s.find('</nav>', s.find('id="menu"'))
                  if pos != -1:
                      s = s[:pos] + admin_link + s[pos:]
                      p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add Admin page and move Ewa numerology tool" || true
          git pull --rebase origin main
          git push origin HEAD:main
